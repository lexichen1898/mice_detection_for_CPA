# 数据集配置
path: /home/zzmonlyyou/Documents/Projects/lexi_mice_detection/dataset  # 数据集根目录
train: train/images  # 训练图像目录
val: val/images  # 验证图像目录

# 类别配置
nc: 1  # 类别数量
names: ['mice']  # 类别名称

# 图像配置
img_size: 640  # 训练图像大小
img_channels: 3  # 图像通道数

# 数据增强配置
hsv_h: 0.015  # HSV-Hue增强
hsv_s: 0.7  # HSV-Saturation增强
hsv_v: 0.4  # HSV-Value增强
degrees: 0.0  # 旋转角度范围
translate: 0.1  # 平移范围
scale: 0.5  # 缩放范围
shear: 0.0  # 剪切范围
perspective: 0.0  # 透视变换范围
flipud: 0.0  # 上下翻转概率
fliplr: 0.5  # 左右翻转概率
mosaic: 1.0  # Mosaic增强概率
mixup: 0.0  # Mixup增强概率 